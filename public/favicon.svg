<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A30"/>
      <stop offset="50%" stop-color="#FF5100"/>
      <stop offset="100%" stop-color="#D03800"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171E"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#262A35" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#favGrad)" stroke-width="2" stroke-dasharray="120 30" opacity="0.85"/>
  <!-- Monogram VD -->
  <g fill="none" stroke="url(#favGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- V -->
    <path d="M19 24 L27 40 L35 24"/>
    <!-- D -->
    <path d="M33 24 L41 24 C46.5 24 49 27.5 49 32 C49 36.5 46.5 40 41 40 L33 40"/>
  </g>
  <!-- Cyber Dot -->
  <circle cx="43" cy="22" r="2.5" fill="#00F0FF"/>
</svg>
