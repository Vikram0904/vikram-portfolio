            <text x="200" y="26" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Central Plaza</text>
            <text x="350" y="26" fill="#10B981" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12">$28.00</text>
